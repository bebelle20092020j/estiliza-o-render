<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sentinela - Hospital Geral</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --azul-escuro: #123e63;
      --azul: #2d6f9f;
      --azul-claro: #6fa8c7;
      --rosa: #c76f9d;
      --lilas: #9f92c8;
      --branco: #ffffff;
      --fundo: #edf4f8;
      --texto: #24435b;
      --borda: #d9e5ee;
    }

    body {
      min-height: 100vh;
      background: var(--fundo);
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;
    }

    /* =========================
       CAIXA PRINCIPAL
    ========================= */

    .login-container {
      width: 100%;
      max-width: 1250px;
      min-height: 700px;

      background: white;

      border-radius: 28px;
      overflow: hidden;

      display: grid;
      grid-template-columns: 1.15fr 0.85fr;

      box-shadow:
        0 25px 70px rgba(18, 62, 99, 0.20);
    }

    /* =========================
       PARTE DA FOTO
    ========================= */

    .hospital {
      position: relative;

      min-height: 700px;

      background-image:
        linear-gradient(
          rgba(18, 62, 99, 0.15),
          rgba(18, 62, 99, 0.10)
        ),
        url("sentinela-hospital-bg.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: flex-end;

      padding: 45px;
    }

    .hospital::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to top,
          rgba(18, 62, 99, 0.72),
          rgba(18, 62, 99, 0.08) 65%,
          transparent
        );

      pointer-events: none;
    }

    /* =========================
       TEXTO SOBRE A FOTO
    ========================= */

    .hospital-text {
      position: relative;
      z-index: 2;

      color: white;

      max-width: 600px;
    }

    .hospital-text .mini {
      font-size: 13px;

      letter-spacing: 3px;

      font-weight: bold;

      margin-bottom: 10px;

      opacity: 0.95;
    }

    .hospital-text h1 {
      font-family: Georgia, "Times New Roman", serif;

      font-size: clamp(38px, 5vw, 65px);

      letter-spacing: 3px;

      line-height: 1;

      margin-bottom: 8px;
    }

    .hospital-text h2 {
      font-size: 17px;

      letter-spacing: 5px;

      font-weight: 600;

      margin-bottom: 15px;
    }

    .hospital-text p {
      font-size: 15px;

      line-height: 1.6;

      max-width: 460px;

      opacity: 0.95;
    }

    /* =========================
       PAINEL DE LOGIN
    ========================= */

    .login-side {
      position: relative;

      background:
        linear-gradient(
          145deg,
          #ffffff 0%,
          #f9fcfd 70%,
          #f4eff7 100%
        );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 45px;
    }

    /* detalhes decorativos */

    .login-side::before {
      content: "";

      position: absolute;

      width: 260px;
      height: 260px;

      border-radius: 50%;

      background: rgba(199, 111, 157, 0.08);

      right: -130px;
      top: -100px;
    }

    .login-side::after {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      border-radius: 50%;

      background: rgba(159, 146, 200, 0.08);

      left: -100px;
      bottom: -80px;
    }

    /* =========================
       CARTÃO
    ========================= */

    .login-card {
      width: 100%;
      max-width: 410px;

      position: relative;
      z-index: 3;

      background: rgba(255, 255, 255, 0.97);

      border: 1px solid var(--borda);

      border-radius: 24px;

      padding: 38px;

      box-shadow:
        0 18px 45px rgba(18, 62, 99, 0.12);
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      text-align: center;

      margin-bottom: 25px;
    }

    .logo-icon {
      width: 70px;
      height: 70px;

      margin: 0 auto 12px;

      position: relative;
    }

    .logo-icon::before {
      content: "♡";

      position: absolute;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--azul-escuro);

      font-family: Arial, sans-serif;

      font-size: 70px;

      line-height: 1;
    }

    .logo-icon::after {
      content: "+";

      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      color: var(--rosa);

      font-size: 25px;

      font-weight: bold;
    }

    .logo h1 {
      color: var(--azul-escuro);

      font-family: Georgia, "Times New Roman", serif;

      font-size: 30px;

      letter-spacing: 2px;
    }

    .logo h2 {
      color: #58748a;

      font-size: 12px;

      letter-spacing: 4px;

      margin-top: 4px;
    }

    .logo p {
      color: #7b909f;

      font-size: 13px;

      margin-top: 11px;
    }

    /* =========================
       LINHA COLORIDA
    ========================= */

    .linha {
      width: 75px;
      height: 3px;

      margin: 18px auto 27px;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          var(--azul),
          var(--lilas),
          var(--rosa)
        );
    }

    /* =========================
       CAMPOS
    ========================= */

    .campo {
      margin-bottom: 18px;
    }

    .campo label {
      display: block;

      color: #31536c;

      font-size: 13px;

      font-weight: bold;

      margin-bottom: 7px;
    }

    .input-container {
      position: relative;
    }

    .icone {
      position: absolute;

      left: 14px;
      top: 50%;

      transform: translateY(-50%);

      font-size: 16px;

      opacity: 0.65;

      z-index: 2;
    }

    .campo input {
      width: 100%;
      height: 52px;

      border: 1px solid var(--borda);

      border-radius: 13px;

      background: #fbfdff;

      color: var(--texto);

      font-size: 14px;

      padding: 0 15px 0 43px;

      outline: none;

      transition: 0.2s;
    }

    .campo input::placeholder {
      color: #9aabb8;
    }

    .campo input:focus {
      border-color: var(--azul-claro);

      background: white;

      box-shadow:
        0 0 0 4px rgba(76, 143, 181, 0.12);
    }

    /* =========================
       BOTÃO
    ========================= */

    .btn-entrar {
      width: 100%;

      height: 53px;

      border: none;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          var(--azul-escuro),
          var(--azul-claro)
        );

      color: white;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 9px 20px rgba(45, 111, 159, 0.22);

      transition: 0.2s;
    }

    .btn-entrar:hover {
      transform: translateY(-1px);

      filter: brightness(1.04);
    }

    .btn-entrar:disabled {
      opacity: 0.7;

      cursor: wait;

      transform: none;
    }

    /* =========================
       RODAPÉ
    ========================= */

    .rodape {
      text-align: center;

      border-top: 1px solid #e7edf2;

      margin-top: 23px;

      padding-top: 17px;

      color: #8497a5;

      font-size: 11px;

      line-height: 1.6;
    }

    .coracao {
      color: var(--rosa);

      font-size: 14px;
    }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 900px) {

      body {
        padding: 12px;
      }

      .login-container {
        grid-template-columns: 1fr;

        min-height: auto;
      }

      .hospital {
        min-height: 430px;
      }

      .login-side {
        padding: 30px 20px;
      }
    }

    @media (max-width: 520px) {

      .hospital {
        min-height: 330px;

        padding: 25px;
      }

      .hospital-text h1 {
        font-size: 40px;
      }

      .hospital-text h2 {
        font-size: 13px;

        letter-spacing: 3px;
      }

      .login-card {
        padding: 28px 23px;
      }

      .logo h1 {
        font-size: 26px;
      }
    }

  </style>
</head>


<body>


  <main class="login-container">


    <!-- =================================
         IMAGEM / IDENTIDADE DO HOSPITAL
    ================================== -->

    <section class="hospital">

      <div class="hospital-text">

        <div class="mini">
          CUIDADO • TECNOLOGIA • HUMANIZAÇÃO
        </div>

        <h1>
          SENTINELA
        </h1>

        <h2>
          HOSPITAL GERAL
        </h2>

        <p>
          Tecnologia e cuidado trabalhando juntos
          para tornar o atendimento mais seguro,
          organizado e humanizado.
        </p>

      </div>

    </section>



    <!-- =================================
         ÁREA DE LOGIN
    ================================== -->

    <section class="login-side">


      <div class="login-card">


        <!-- LOGO -->

        <div class="logo">

          <div class="logo-icon"></div>

          <h1>
            SENTINELA
          </h1>

          <h2>
            HOSPITAL GERAL
          </h2>

          <p>
            Cuidado em cada detalhe
          </p>

          <div class="linha"></div>

        </div>



        <!-- USUÁRIO -->

        <div class="campo">

          <label for="usuario">
            Usuário
          </label>

          <div class="input-container">

            <span class="icone">
              👤
            </span>

            <input
              type="text"
              id="usuario"
              placeholder="Digite seu usuário"
              autocomplete="username"
            >

          </div>

        </div>



        <!-- SENHA -->

        <div class="campo">

          <label for="senha">
            Senha
          </label>

          <div class="input-container">

            <span class="icone">
              🔒
            </span>

            <input
              type="password"
              id="senha"
              placeholder="Digite sua senha"
              autocomplete="current-password"
            >

          </div>

        </div>



        <!-- BOTÃO -->

        <button
          class="btn-entrar"
          id="btnEntrar"
          onclick="login()"
        >
          Entrar no sistema
        </button>



        <!-- RODAPÉ -->

        <div class="rodape">

          <span class="coracao">
            ♥
          </span>

          Ambiente seguro e protegido

          <br>

          Sentinela Hospital Geral

        </div>


      </div>


    </section>


  </main>



  <script>

    async function login() {

      const usuario =
        document
          .getElementById("usuario")
          .value
          .trim();

      const senha =
        document
          .getElementById("senha")
          .value;

      const botao =
        document
          .getElementById("btnEntrar");


      if (!usuario || !senha) {

        alert(
          "Por favor, preencha o usuário e a senha."
        );

        return;
      }


      botao.disabled = true;

      botao.innerText =
        "Entrando...";


      try {

        const resposta =
          await fetch(
            "/login",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                usuario: usuario,
                senha: senha
              })
            }
          );


        if (!resposta.ok) {

          throw new Error(
            "Erro no servidor"
          );

        }


        const data =
          await resposta.json();


        /* =========================
           TRIAGEM
        ========================= */

        if (
          data.tipo === "triagem"
        ) {

          window.location.href =
            "triagem.html";

          return;
        }


        /* =========================
           MÉDICO
        ========================= */

        if (
          data.tipo === "medico"
        ) {

          window.location.href =
            "medico.html";

          return;
        }


        /* =========================
           ATENDIMENTO
        ========================= */

        if (
          data.tipo === "atendimento"
        ) {

          window.location.href =
            "atendimento.html";

          return;
        }


        /* =========================
           LOGIN INVÁLIDO
        ========================= */

        alert(
          "Usuário ou senha inválidos."
        );


        botao.disabled = false;

        botao.innerText =
          "Entrar no sistema";

      }


      catch (erro) {

        console.error(
          "Erro:",
          erro
        );


        alert(
          "Não foi possível conectar ao servidor."
        );


        botao.disabled = false;

        botao.innerText =
          "Entrar no sistema";

      }

    }


    /* =========================
       ENTER PARA ENTRAR
    ========================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          login();

        }

      }
    );

  </script>


</body>
</html>
