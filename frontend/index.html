<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sentinela Hospital Geral</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --navy: #123e63;
  --blue: #2d6f9f;
  --blue2: #4c8fb5;
  --pink: #c76f9d;
  --lilac: #9f92c8;
  --white: #ffffff;
  --text: #24435b;
  --line: #d9e5ee;
}

body {
  min-height: 100vh;
  font-family: Inter, Segoe UI, Arial, sans-serif;
  background: #edf4f8;
  color: var(--text);

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 24px;
  overflow-x: hidden;
}


/* =========================================
   ESTRUTURA PRINCIPAL
========================================= */

.login-shell {
  width: min(1280px, 100%);
  min-height: 720px;

  display: grid;
  grid-template-columns: 1.18fr .82fr;

  background: #fff;

  border-radius: 28px;
  overflow: hidden;

  box-shadow:
    0 25px 70px rgba(18, 62, 99, .20);

  position: relative;
}


/* =========================================
   PARTE DO HOSPITAL
========================================= */

.hero {
  position: relative;

  min-height: 720px;

  background-image: url("sentinela-hospital-bg.jpg");

  background-size: cover;
  background-position: center;

  display: flex;
  align-items: flex-end;

  padding: 42px;
}

.hero::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      90deg,
      rgba(18, 62, 99, .05),
      rgba(18, 62, 99, .02) 55%,
      rgba(255, 255, 255, .10)
    );

  pointer-events: none;
}


/* =========================================
   ÁREA DO LOGIN
========================================= */

.login-area {

  position: relative;

  background:
    linear-gradient(
      145deg,
      #ffffff 0%,
      #f8fbfd 70%,
      #f4eff7 100%
    );

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 48px;
}

.login-area::before {

  content: "";

  position: absolute;

  width: 330px;
  height: 330px;

  border-radius: 50%;

  right: -160px;
  bottom: -140px;

  background:
    rgba(199, 111, 157, .10);
}


/* =========================================
   CARTÃO
========================================= */

.login-card {

  width: min(430px, 100%);

  position: relative;
  z-index: 2;

  background: rgba(255, 255, 255, .97);

  border: 1px solid #dce7ef;

  border-radius: 24px;

  padding: 38px 38px 30px;

  box-shadow:
    0 18px 45px rgba(18, 62, 99, .12);
}


/* =========================================
   LOGO
========================================= */

.brand {

  text-align: center;

  margin-bottom: 26px;
}

.logo-mark {

  width: 74px;
  height: 74px;

  margin: 0 auto 12px;

  position: relative;
}

.logo-mark::before {

  content: "♡";

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 72px;

  line-height: 1;

  color: var(--navy);

  font-family: Arial;
}

.logo-mark::after {

  content: "+";

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -47%);

  font-size: 25px;

  font-weight: 800;

  color: var(--pink);
}

.brand h1 {

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color: var(--navy);

  font-size: 31px;

  letter-spacing: 2px;

  font-weight: 700;
}

.brand h2 {

  font-size: 12px;

  letter-spacing: 4px;

  color: #55758d;

  margin-top: 3px;

  font-weight: 700;
}

.brand p {

  font-size: 13px;

  color: #71899b;

  margin-top: 12px;
}


/* =========================================
   DETALHE COLORIDO
========================================= */

.divider {

  height: 3px;

  width: 74px;

  margin:
    18px auto 26px;

  border-radius: 10px;

  background:
    linear-gradient(
      90deg,
      var(--blue),
      var(--lilac),
      var(--pink)
    );
}


/* =========================================
   CAMPOS
========================================= */

.campo {

  margin-bottom: 18px;
}

.campo label {

  display: block;

  font-size: 13px;

  font-weight: 700;

  color: #31536c;

  margin-bottom: 7px;
}

.input-box {

  position: relative;
}

.icone {

  position: absolute;

  left: 14px;
  top: 50%;

  transform:
    translateY(-50%);

  font-size: 16px;

  opacity: .72;

  z-index: 2;
}

input {

  width: 100%;

  height: 52px;

  border:
    1px solid var(--line);

  border-radius: 13px;

  background: #fbfdff;

  color: var(--text);

  font-size: 14px;

  padding:
    0 15px 0 44px;

  outline: none;

  transition: .2s;
}

input::placeholder {

  color: #9aabb8;
}

input:focus {

  border-color:
    var(--blue2);

  box-shadow:
    0 0 0 4px
    rgba(76, 143, 181, .12);

  background: #fff;
}


/* =========================================
   BOTÃO
========================================= */

button {

  width: 100%;

  height: 53px;

  border: 0;

  border-radius: 13px;

  background:
    linear-gradient(
      135deg,
      var(--navy),
      var(--blue2)
    );

  color: #fff;

  font-size: 15px;

  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 9px 20px
    rgba(45, 111, 159, .22);

  transition: .2s;
}

button:hover {

  transform:
    translateY(-1px);

  filter:
    brightness(1.03);
}

button:disabled {

  opacity: .7;

  cursor: wait;

  transform: none;
}


/* =========================================
   RODAPÉ
========================================= */

.rodape {

  margin-top: 23px;

  padding-top: 18px;

  border-top:
    1px solid #e7edf2;

  text-align: center;

  color: #8497a5;

  font-size: 11px;

  line-height: 1.6;
}

.rodape .coracao {

  color: var(--pink);

  font-size: 14px;
}


/* =========================================
   CELULAR / TABLET
========================================= */

@media (max-width: 900px) {

  body {
    padding: 12px;
  }

  .login-shell {

    grid-template-columns: 1fr;

    min-height: auto;
  }

  .hero {

    min-height: 390px;

    padding: 25px;
  }

  .login-area {

    padding: 28px 20px;
  }

  .login-card {

    padding:
      32px 26px 27px;
  }
}


@media (max-width: 520px) {

  .hero {

    min-height: 300px;

    background-position:
      30% center;
  }

  .brand h1 {

    font-size: 27px;
  }

  .login-card {

    border-radius: 20px;
  }
}

</style>
</head>


<body>


<main class="login-shell">


  <!-- =====================================
       FOTO DO HOSPITAL
  ====================================== -->

  <section
    class="hero"
    aria-label="Entrada do Hospital Sentinela">
  </section>



  <!-- =====================================
       LOGIN
  ====================================== -->

  <section class="login-area">


    <div class="login-card">


      <!-- LOGO -->

      <div class="brand">

        <div
          class="logo-mark"
          aria-label="Logo Sentinela">
        </div>

        <h1>SENTINELA</h1>

        <h2>HOSPITAL GERAL</h2>

        <p>
          Cuidado em cada detalhe
        </p>

        <div class="divider"></div>

      </div>



      <!-- USUÁRIO -->

      <div class="campo">

        <label for="usuario">
          Usuário
        </label>

        <div class="input-box">

          <span class="icone">
            👤
          </span>

          <input
            id="usuario"
            type="text"
            placeholder="Digite seu usuário"
            autocomplete="username">

        </div>

      </div>



      <!-- SENHA -->

      <div class="campo">

        <label for="senha">
          Senha
        </label>

        <div class="input-box">

          <span class="icone">
            🔒
          </span>

          <input
            id="senha"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password">

        </div>

      </div>



      <!-- BOTÃO -->

      <button
        id="btnEntrar"
        onclick="login()">

        Entrar no sistema

      </button>



      <!-- RODAPÉ -->

      <div class="rodape">

        <span class="coracao">
          ♥
        </span>

        Ambiente seguro e protegido

        <br>

        Sentinela Hospital Geral

      </div>


    </div>

  </section>

</main>



<script>


/* =========================================
   LOGIN
========================================= */

function login() {


  const usuario =
    document
      .getElementById("usuario")
      .value
      .trim();


  const senha =
    document
      .getElementById("senha")
      .value;


  const botao =
    document
      .getElementById("btnEntrar");



  /* =====================================
     VALIDAÇÃO
  ====================================== */

  if (!usuario || !senha) {

    alert(
      "Por favor, preencha o usuário e a senha."
    );

    return;

  }



  /* =====================================
     ESTADO DO BOTÃO
  ====================================== */

  botao.disabled = true;

  botao.innerText =
    "Entrando...";



  /* =====================================
     LOGIN
  ====================================== */

  fetch(
    "/login",
    {

      method: "POST",

      headers: {

        "Content-Type":
          "application/json"

      },

      body: JSON.stringify({

        usuario: usuario,

        senha: senha

      })

    }
  )


  .then(response => {

    if (!response.ok) {

      throw new Error(
        "Erro no servidor"
      );

    }

    return response.json();

  })


  .then(data => {


    /* TRIAGEM */

    if (
      data.tipo ===
      "triagem"
    ) {

      window.location.href =
        "triagem.html";

      return;

    }


    /* MÉDICO */

    if (
      data.tipo ===
      "medico"
    ) {

      window.location.href =
        "medico.html";

      return;

    }


    /* ATENDIMENTO */

    if (
      data.tipo ===
      "atendimento"
    ) {

      window.location.href =
        "atendimento.html";

      return;

    }


    /* LOGIN INVÁLIDO */

    alert(
      "Usuário ou senha inválidos."
    );


    botao.disabled = false;

    botao.innerText =
      "Entrar no sistema";

  })


  .catch(error => {

    console.error(
      "Erro:",
      error
    );


    alert(
      "Não foi possível conectar ao servidor."
    );


    botao.disabled = false;

    botao.innerText =
      "Entrar no sistema";

  });

}



/* =========================================
   ENTER PARA LOGIN
========================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Enter"
    ) {

      login();

    }

  }
);


</script>


</body>
</html>
