<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta médica - Sentinela</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .topo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .campo{display:flex;flex-direction:column}
    .campo label{font-weight:bold;margin-top:10px;color:#333}
    .campo input,.campo select,.campo textarea{box-sizing:border-box}
    .campo.full{grid-column:1/-1}
    .acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .acoes button{flex:1;min-width:180px}
    .btn-sec{background:#6c757d}.btn-sec:hover{background:#545b62}
    .aviso{padding:12px;border-radius:8px;background:#f0f4ff;border:1px solid #d0d8f0;color:#34495e;margin:15px 0}
    @media(max-width:650px){.grid{grid-template-columns:1fr}}
    @media print{body{background:white}.container{width:100%;max-width:none;box-shadow:none;margin:0;padding:0}.acoes,.aviso{display:none}input,select,textarea{border:1px solid #999!important}.topo button{display:none}}
  </style>
  <link rel="stylesheet" href="css/estilo-novo.css">
</head>

<body>

<div class="container">

  <div class="topo">
    <h2 style="margin:0">🩺 Consulta médica</h2>
    <button type="button" style="width:auto" onclick="window.close()">Voltar</button>
  </div>

  <div class="aviso">
    Preencha os dados da consulta. Ao final, clique em
    <b>Gerar PDF de alta</b> para criar o documento com as informações registradas.
  </div>

  <form id="consultaForm">

    <div class="grid">

      <div class="campo">
        <label for="paciente">Paciente *</label>
        <input id="paciente" required placeholder="Nome completo">
      </div>

      <div class="campo">
        <label for="data">Data da consulta *</label>
        <input id="data" type="date" required>
      </div>

      <div class="campo">
        <label for="medico">Médico responsável *</label>
        <input id="medico" required placeholder="Nome do médico">
      </div>

      <div class="campo">
        <label for="crm">CRM</label>
        <input id="crm" placeholder="Registro profissional">
      </div>

      <div class="campo">
        <label for="sintomas">Queixa principal / sintomas</label>
        <textarea id="sintomas" placeholder="Relato do paciente e sintomas apresentados"></textarea>
      </div>

      <div class="campo">
        <label for="sinais">Sinais vitais</label>
        <textarea id="sinais" placeholder="Pressão, temperatura, frequência cardíaca etc."></textarea>
      </div>

      <div class="campo full">
        <label for="diagnostico">Diagnóstico / avaliação clínica *</label>
        <textarea id="diagnostico" required placeholder="Informe o diagnóstico ou avaliação clínica"></textarea>
      </div>

      <div class="campo full">
        <label for="medicacao">Medicação / prescrição</label>
        <textarea id="medicacao" placeholder="Medicamento, dose, via e frequência. Se não houver, escreva 'Não prescrita'."></textarea>
      </div>

      <div class="campo full">
        <label for="orientacoes">Orientações ao paciente</label>
        <textarea id="orientacoes" placeholder="Cuidados, recomendações e sinais de alerta"></textarea>
      </div>

      <div class="campo">
        <label for="retorno">Retorno recomendado</label>
        <input id="retorno" placeholder="Ex.: Em 7 dias ou se necessário">
      </div>

      <div class="campo">
        <label for="condicao">Condição na alta *</label>
        <select id="condicao" required>
          <option value="Estável">Estável</option>
          <option value="Melhorado">Melhorado</option>
          <option value="Sem alterações">Sem alterações</option>
          <option value="Encaminhado">Encaminhado para outro serviço</option>
          <option value="Internação">Internação</option>
        </select>
      </div>

      <div class="campo full">
        <label for="observacoes">Observações adicionais</label>
        <textarea id="observacoes" placeholder="Outras informações importantes"></textarea>
      </div>

    </div>

    <div class="acoes">
      <button type="submit">💾 Salvar consulta</button>
      <button type="button" class="btn-sec" onclick="gerarPDF()">📄 Gerar PDF de alta</button>
    </div>

  </form>

</div>

<script>

const ids=[
  'paciente',
  'data',
  'medico',
  'crm',
  'sintomas',
  'sinais',
  'diagnostico',
  'medicacao',
  'orientacoes',
  'retorno',
  'condicao',
  'observacoes'
];

document.getElementById('data').value =
  new Date().toISOString().slice(0,10);

const pacienteParam =
  new URLSearchParams(window.location.search).get('paciente');

if(pacienteParam)
  document.getElementById('paciente').value=pacienteParam;

function dados(){
  const o={};

  ids.forEach(id =>
    o[id]=document.getElementById(id).value.trim()
  );

  return o;
}

async function salvarConsulta(silencioso=false){

  const d=dados();

  if(!d.paciente||!d.data||!d.medico||!d.diagnostico){

    if(!silencioso)
      alert(
        'Preencha os campos obrigatórios: paciente, data, médico e diagnóstico.'
      );

    return false;
  }

  try{

    const r=await fetch(
      '/consulta',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify(d)
      }
    );

    if(!r.ok)
      throw Error();

    if(!silencioso)
      alert('✅ Consulta salva com sucesso!');

    return true;

  }catch(e){

    if(!silencioso)
      alert(
        'Não foi possível salvar a consulta. Verifique se o servidor está ativo.'
      );

    return false;
  }
}

document
  .getElementById('consultaForm')
  .addEventListener(
    'submit',
    e=>{
      e.preventDefault();
      salvarConsulta();
    }
  );

function escapar(v){

  return String(v||'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}

async function gerarPDF(){

  const d=dados();

  if(!d.paciente||!d.data||!d.medico||!d.diagnostico){

    alert(
      'Preencha os campos obrigatórios antes de gerar o PDF.'
    );

    return;
  }

  await salvarConsulta(true);

  const w=window.open('','_blank');

  if(!w){

    alert(
      'Permita pop-ups para gerar o PDF.'
    );

    return;
  }

  w.document.write(`
<!doctype html>
<html>
<head>

<meta charset="utf-8">

<title>
Alta - ${escapar(d.paciente)}
</title>

<style>

body{
  font-family:Arial;
  margin:40px;
  color:#222
}

h1{
  text-align:center;
  font-size:22px
}

h2{
  font-size:16px;
  border-bottom:1px solid #aaa;
  padding-bottom:5px;
  margin-top:24px
}

.linha{
  margin:8px 0;
  white-space:pre-wrap
}

.rodape{
  margin-top:45px;
  text-align:center
}

@media print{
  button{
    display:none
  }
}

</style>

</head>

<body>

<h1>
DOCUMENTO DE ALTA / CONSULTA MÉDICA
</h1>

<p>
<b>Paciente:</b>
${escapar(d.paciente)}
</p>

<p>
<b>Data:</b>
${escapar(d.data)}
&nbsp;

<b>Médico:</b>
${escapar(d.medico)}
&nbsp;

<b>CRM:</b>
${escapar(d.crm)}
</p>

<h2>
Queixa principal / sintomas
</h2>

<div class="linha">
${escapar(d.sintomas)||'Não informado'}
</div>

<h2>
Sinais vitais
</h2>

<div class="linha">
${escapar(d.sinais)||'Não informado'}
</div>

<h2>
Diagnóstico / avaliação clínica
</h2>

<div class="linha">
${escapar(d.diagnostico)}
</div>

<h2>
Medicação / prescrição
</h2>

<div class="linha">
${escapar(d.medicacao)||'Não prescrita'}
</div>

<h2>
Orientações
</h2>

<div class="linha">
${escapar(d.orientacoes)||'Não informado'}
</div>

<h2>
Retorno e condição na alta
</h2>

<div class="linha">
<b>Retorno:</b>
${escapar(d.retorno)||'Se necessário'}

<b>Condição:</b>
${escapar(d.condicao)}
</div>

<h2>
Observações
</h2>

<div class="linha">
${escapar(d.observacoes)||'Nenhuma'}
</div>

<div class="rodape">

__________________________________

<br>

${escapar(d.medico)}

${d.crm?' - CRM '+escapar(d.crm):''}

</div>

<br>

<button onclick="window.print()">
Imprimir / Salvar como PDF
</button>

</body>
</html>
`);

  w.document.close();
  w.focus();

  setTimeout(
    ()=>{
      w.print();
    },
    400
  );

}

</script>

</body>
</html>
